{% extends "base.html" %} {% block title %}{{_("Comparison")}} — Navidrome
Stats{% endblock %} {% block content %}
<h1 class="mb-4">{{_("User Comparison")}}</h1>
<p class="text-muted mb-4">
    {{_("Global Top 20 Songs — Plays per User Comparison.")}}
</p>

<div class="mb-5">
    <canvas id="compareChart" height="120"></canvas>
</div>

<div class="table-responsive" id="compareTable">
    <p class="text-muted">{{_("Loading data")}}…</p>
</div>
{% endblock %} {% block scripts %}
<script type="module">
    import { COLORS } from "{{ url_for('static',path='js/charts.js') }}";

    function isDark() {
        return document.documentElement.getAttribute('data-bs-theme') === 'dark';
    }
    function gridColor() { return isDark() ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.1)'; }
    function tickColor() { return isDark() ? '#aaa' : '#666'; }

    fetch("{{url_for('get_compare_songs')}}")
        .then((r) => r.json())
        .then(({ songs, users, matrix }) => {
            if (!songs.length) {
                document.getElementById("compareTable").innerHTML =
                    '<p class="text-muted">{{_("No data available")}}</p>';
                return;
            }

            // Grouped bar chart: one dataset per user
            const datasets = users.map((u, i) => ({
                label: u,
                data: matrix[i],
                backgroundColor: COLORS[i % COLORS.length] + "cc",
                borderColor: COLORS[i % COLORS.length],
                borderWidth: 1,
            }));

            const chart = new Chart(document.getElementById("compareChart"), {
                type: "bar",
                data: { labels: songs, datasets },
                options: {
                    responsive: true,
                    plugins: { legend: { position: "top" } },
                    scales: {
                        x: {
                            ticks: { maxRotation: 45, font: { size: 11 }, color: tickColor() },
                            grid: { color: gridColor() },
                        },
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: "{{_('Plays')}}", color: tickColor() },
                            ticks: { color: tickColor() },
                            grid: { color: gridColor() },
                        },
                    },
                },
            });

            // Re-color when theme toggles
            new MutationObserver(() => {
                chart.options.scales.x.ticks.color = tickColor();
                chart.options.scales.x.grid.color = gridColor();
                chart.options.scales.y.title.color = tickColor();
                chart.options.scales.y.ticks.color = tickColor();
                chart.options.scales.y.grid.color = gridColor();
                chart.update();
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

            // Comparison table
            const maxPerSong = songs.map((_, si) =>
                Math.max(...matrix.map((row) => row[si])),
            );
            let html =
                '<table class="table table-sm table-bordered compare-table"><thead><tr>';
            html +=
                "<th>{{_('Song')}}</th>" +
                users.map((u) => `<th>${u}</th>`).join("") +
                "</tr></thead><tbody>";
            songs.forEach((song, si) => {
                html += '<tr><td class="song-cell">' + song + "</td>";
                users.forEach((_, ui) => {
                    const v = matrix[ui][si];
                    const isTop = v > 0 && v === maxPerSong[si];
                    html += `<td class="${v === 0 ? "text-muted" : ""}${isTop ? " fw-bold text-success" : ""}">${v || "—"}</td>`;
                });
                html += "</tr>";
            });
            html += "</tbody></table>";
            document.getElementById("compareTable").innerHTML = html;
        });
</script>
{% endblock %}
